services:
  mongodb:
    image: mongo:7.0
    container_name: newtonite-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval 'try { if (rs.status().ok === 1) quit(0); } catch (e) {} try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); quit(0); } catch (e) { quit(1); }'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo_data:
